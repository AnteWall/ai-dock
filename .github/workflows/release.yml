name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ai-dock (Release)
        run: |
          xcodebuild \
            -project "ai-dock.xcodeproj" \
            -scheme "ai-dock" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          ZIP_NAME="ai-dock-${GITHUB_REF_NAME}.zip"
          APP_PATH="build/DerivedData/Build/Products/Release/ai-dock.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          shasum -a 256 "$ZIP_NAME" > "${ZIP_NAME}.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ai-dock ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ai-dock-${{ github.ref_name }}.zip
            ai-dock-${{ github.ref_name }}.zip.sha256
