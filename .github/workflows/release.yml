name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build ai-dock (Release)
        run: |
          xcodebuild \
            -project "ai-dock.xcodeproj" \
            -scheme "ai-dock" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Stage and ad-hoc sign app bundle
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/ai-dock.app"
          STAGING_DIR="build/release-staging"

          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/ai-dock.app"

          xattr -cr "$STAGING_DIR/ai-dock.app"

          codesign --force --deep --sign - "$STAGING_DIR/ai-dock.app"
          codesign --verify --deep --strict --verbose=2 "$STAGING_DIR/ai-dock.app"

      - name: Package app
        run: |
          DMG_NAME="ai-dock-${GITHUB_REF_NAME}.dmg"
          STAGING_DIR="build/release-staging"

          hdiutil create \
            -volname "ai-dock" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "$DMG_NAME"

      - name: Generate checksum
        run: |
          DMG_NAME="ai-dock-${GITHUB_REF_NAME}.dmg"
          shasum -a 256 "$DMG_NAME" > "${DMG_NAME}.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ai-dock ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ai-dock-${{ github.ref_name }}.dmg
            ai-dock-${{ github.ref_name }}.dmg.sha256
