name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build macOS App
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build ai-dock (Debug)
        run: |
          xcodebuild \
            -project "ai-dock.xcodeproj" \
            -scheme "ai-dock" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-dock-debug-app
          path: build/DerivedData/Build/Products/Debug/ai-dock.app
          if-no-files-found: error
